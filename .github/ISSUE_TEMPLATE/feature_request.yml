name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what's hard or missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
      description: Your idea for how FornaX RDS Ai could help.
